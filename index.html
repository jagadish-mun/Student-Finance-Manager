<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Finance Manager - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: url('https://source.unsplash.com/featured/?finance') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
            width: 400px;
            max-width: 90%;
            text-align: center;
        }

        .card {
            width: 100%;
        }

        h2 {
            margin-bottom: 1rem;
            color: #2c3e50;
        }

        input[type="email"],
        input[type="password"] {
            width: calc(100%); /* Adjusted width to account for padding */
            padding: 0.8rem;
            margin: 0.5rem 0; /* Ensure equal margin on all sides */
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box; /* Ensure padding is included in the element's total width and height */
            transition: all 0.3s ease;
        }

        input[type="email"]:hover,
        input[type="password"]:hover,
        input[type="email"]:focus,
        input[type="email"]:focus{
            transform: scale(1.05);
        }

        button {
            width: 100%;
            padding: 0.8rem;
            background-color: #2980b9;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
        }

        .btn-google {
            background-color: #db4437;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 1rem;
        }

        .btn-google:hover {
            background-color: #c23321;
            transform: scale(1.05);
        }

        .btn-google i {
            margin-right: 0.5rem;
        }

        p {
            margin-top: 1rem;
        }

        a {
            color: #2980b9;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

    </style>
</head>

<body>
    <div id="authContainer" class="container">
        <div id="loginForm" class="card">
            <h2>Login</h2>
            <form id="login">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <button id="googleSignInBtn" class="btn-google">
                <i class="fab fa-google"></i> Sign in with Google
            </button>
            <p>Don't have an account? <a href="#" id="showSignup">Sign up</a></p>
        </div>
        <div id="signupForm" class="card hidden">
            <h2>Sign Up</h2>
            <form id="signup">
                <input type="email" id="signupEmail" placeholder="Email" required>
                <input type="password" id="signupPassword" placeholder="Password" required>
                <button type="submit">Sign Up</button>
            </form>
            <p>Already have an account? <a href="#" id="showLogin">Login</a></p>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="script.js"></script>
]   <script src="gpt.js"></script>

</body>

</html>
