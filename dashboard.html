<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Finance Manager - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="appContainer" class="container">
        <header>
            <h1><i class="fas fa-wallet"></i> Student Finance Manager</h1>
        </header>
        <nav>
            <button id="addTransactionBtn" class="active"><i class="fas fa-plus"></i> Add Transaction</button>
            <button id="viewBalanceBtn"><i class="fas fa-balance-scale"></i> View Balance</button>
            <button id="generateSummaryBtn"><i class="fas fa-chart-pie"></i> Generate Summary</button>
            <button id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </nav>
        <main>
            <section id="transactionForm" class="card hidden">
                <h2><i class="fas fa-exchange-alt"></i> Add Transaction</h2>
                <form id="transactionInputForm">
                    <div class="form-group">
                        <label for="transactionType">Type:</label>
                        <select id="transactionType" required>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount:</label>
                        <input type="number" id="amount" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category:</label>
                        <input type="text" id="category" required>
                    </div>
                    <div class="form-group">
                        <label for="date">Date:</label>
                        <input type="date" id="date" required>
                    </div>
                    <button type="submit" class="btn-primary">Add Transaction</button>
                </form>
            </section>
            <section id="balanceView" class="card hidden">
                <h2><i class="fas fa-piggy-bank"></i> Current Balance</h2>
                <p id="currentBalance" class="balance"></p>
            </section>
            <section id="summaryView" class="card hidden">
                <h2><i class="fas fa-chart-bar"></i> Financial Summary</h2>
                <div class="form-group">
                    <label for="summaryPeriod">Period:</label>
                    <select id="summaryPeriod">
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                    </select>
                </div>
                <div id="summaryResults"></div>
                <canvas id="summaryGraph" width="400" height="50"></canvas>
                
                <!-- New Chatbot Section -->
                <div id="chatbotSection">
                    <h3><i class="fas fa-robot"></i> Financial Assistant</h3>
                    <div id="chatbotMessages"></div>
                    <div id="chatbotInput">
                        <input type="text" id="userInput" placeholder="Ask for financial advice...">
                        <button id="sendMessage"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </section>
            <section id="transactionListSection" class="card">
                <h2><i class="fas fa-list"></i> Transactions</h2>
                <div class="search-container">
                    <input type="text" id="searchTransactions" placeholder="Search transactions...">
                    <i class="fas fa-search"></i>
                </div>
                <ul id="transactions"></ul>
            </section>
        </main>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <script src="script.js"></script>
    <script src="gpt.js"></script>
</body>
</html>
